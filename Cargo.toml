[package]
autoexamples = false
categories = ["parsing", "text-editors"]
description = "Synquid grammar for tree-sitter"
edition = "2021"
keywords = ["incremental", "parsing", "tree-sitter", "synquid"]
license = "MIT"
name = "tree-sitter-synquid"
version = "0.21.0"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = ">= 0.21.0"

[build-dependencies]
cc = "1.0.96"
